<script>

/* ====================================================
NORTH PROTECTION
MONITORING SETTINGS SYSTEM
==================================================== */

let npAccounts =
JSON.parse(
localStorage.getItem('np_monitored_accounts')
) || [];

let npEditId = null;

/* ====================================================
OPEN/CLOSE MODAL
==================================================== */

function openNPModal(){

    document
    .getElementById('npModal')
    .style.display='flex';

}

function closeNPModal(){

    document
    .getElementById('npModal')
    .style.display='none';

    clearNPForm();
}

/* ====================================================
CLEAR FORM
==================================================== */

function clearNPForm(){

    npEditId = null;

    document.getElementById('npUsername').value='';
    document.getElementById('npPassword').value='';

}

/* ====================================================
SAVE ACCOUNT
==================================================== */

function saveNPAccount(){

    const platform =
    document.getElementById('npPlatform').value;

    const username =
    document.getElementById('npUsername').value;

    const password =
    document.getElementById('npPassword').value;

    const level =
    document.getElementById('npMonitoringLevel').value;

    if(!username || !password){
        return;
    }

    const account = {

        id: npEditId || Date.now(),

        platform,
        username,
        password,
        level,

        active:true,

        lastScan:
        new Date().toLocaleString()

    };

    if(npEditId){

        npAccounts =
        npAccounts.map(acc =>
            acc.id === npEditId
            ? account
            : acc
        );

    }else{

        npAccounts.push(account);

    }

    localStorage.setItem(
        'np_monitored_accounts',
        JSON.stringify(npAccounts)
    );

    renderNPAccounts();

    closeNPModal();

}

/* ====================================================
RENDER ACCOUNTS
==================================================== */

function renderNPAccounts(){

    const container =
    document.getElementById('npAccountsList');

    if(!container) return;

    container.innerHTML='';

    npAccounts.forEach(account => {

        const masked =
        '•'.repeat(
            Math.max(6, account.password.length)
        );

        container.innerHTML += `

        <div class="np-account-card">

            <div class="np-card-top">

                <div>

                    <div class="np-platform">
                        ${getPlatformIcon(account.platform)}
                        ${account.platform}
                    </div>

                    <div class="np-user">
                        ${account.username}
                    </div>

                </div>

                <div class="np-status">

                    <div class="np-status-dot"></div>

                    ${
                        account.active
                        ? 'PROTECTED'
                        : 'PAUSED'
                    }

                </div>

            </div>

            <div class="np-card-info">

                <div class="np-info-box">

                    <div class="np-info-label">
                        Password
                    </div>

                    <div class="np-info-value">
                        ${masked}
                    </div>

                </div>

                <div class="np-info-box">

                    <div class="np-info-label">
                        Monitoring
                    </div>

                    <div class="np-info-value">
                        ${account.level}
                    </div>

                </div>

                <div class="np-info-box">

                    <div class="np-info-label">
                        Last Scan
                    </div>

                    <div class="np-info-value">
                        ${account.lastScan}
                    </div>

                </div>

                <div class="np-info-box">

                    <div class="np-info-label">
                        Protection
                    </div>

                    <div class="np-info-value">
                        Active Shield
                    </div>

                </div>

            </div>

            <div class="np-actions">

                <button onclick="editNPAccount(${account.id})">
                    Edit
                </button>

                <button onclick="toggleNPAccount(${account.id})">
                    ${
                        account.active
                        ? 'Pause Monitoring'
                        : 'Enable Monitoring'
                    }
                </button>

                <button onclick="removeNPAccount(${account.id})">
                    Remove
                </button>

            </div>

        </div>

        `;

    });

}

/* ====================================================
EDIT
==================================================== */

function editNPAccount(id){

    const acc =
    npAccounts.find(a => a.id === id);

    if(!acc) return;

    npEditId = id;

    document.getElementById('npPlatform').value =
    acc.platform;

    document.getElementById('npUsername').value =
    acc.username;

    document.getElementById('npPassword').value =
    acc.password;

    document.getElementById('npMonitoringLevel').value =
    acc.level;

    openNPModal();

}

/* ====================================================
REMOVE
==================================================== */

function removeNPAccount(id){

    npAccounts =
    npAccounts.filter(a => a.id !== id);

    localStorage.setItem(
        'np_monitored_accounts',
        JSON.stringify(npAccounts)
    );

    renderNPAccounts();

}

/* ====================================================
TOGGLE
==================================================== */

function toggleNPAccount(id){

    npAccounts =
    npAccounts.map(acc => {

        if(acc.id === id){

            acc.active = !acc.active;

        }

        return acc;

    });

    localStorage.setItem(
        'np_monitored_accounts',
        JSON.stringify(npAccounts)
    );

    renderNPAccounts();

}

/* ====================================================
PLATFORM ICONS
==================================================== */

function getPlatformIcon(platform){

    const icons = {

        Instagram:'📸',
        Facebook:'📘',
        TikTok:'🎵',
        'X/Twitter':'✖️',
        Discord:'🎮',
        Telegram:'📨',
        Snapchat:'👻',
        LinkedIn:'💼',
        WhatsApp:'💬',
        Gmail:'✉️',
        Outlook:'📧',
        Yahoo:'📩'

    };

    return icons[platform] || '🔐';

}

/* ====================================================
INIT
==================================================== */

renderNPAccounts();

</script>
