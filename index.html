<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North Protection</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
}

:root{
--blue:#2563eb;
--cyan:#22d3ee;
--green:#22c55e;
--red:#ef4444;
--card:#0f172a;
}

header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.3);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:22px;
font-weight:bold;
background:linear-gradient(90deg,var(--cyan),white);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.live{
color:var(--green);
font-size:14px;
}

.container{
padding:20px;
padding-bottom:120px;
max-width:900px;
margin:auto;
}

.card{
background:rgba(15,23,42,.9);
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:20px;
margin-bottom:20px;
box-shadow:0 10px 40px rgba(0,0,0,.35);
}

h2{
margin-bottom:15px;
}

input,select{
width:100%;
padding:14px;
margin-bottom:12px;
border:none;
border-radius:14px;
background:#111c33;
color:white;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:16px;
background:linear-gradient(90deg,var(--blue),var(--cyan));
color:white;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.02);
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.stat{
background:#111c33;
padding:18px;
border-radius:18px;
}

.big{
font-size:40px;
font-weight:bold;
margin-top:10px;
}

.account{
background:#111c33;
padding:16px;
border-radius:16px;
margin-top:12px;
border:1px solid rgba(255,255,255,.05);
}

.account small{
color:#94a3b8;
display:block;
margin-top:6px;
}

.alert{
padding:15px;
background:rgba(239,68,68,.12);
border:1px solid rgba(239,68,68,.25);
border-radius:16px;
margin-top:12px;
animation:pulse 2s infinite;
}

@keyframes pulse{
50%{transform:scale(1.01);}
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:80px;
background:#08111f;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid rgba(255,255,255,.06);
}

.nav-item{
text-align:center;
font-size:13px;
color:#94a3b8;
cursor:pointer;
}

.nav-item.active{
color:var(--cyan);
}

canvas{
width:100%;
height:220px;
background:#111c33;
border-radius:20px;
}

.profile{
display:flex;
align-items:center;
gap:18px;
}

.avatar{
width:80px;
height:80px;
border-radius:50%;
background:linear-gradient(135deg,var(--blue),var(--cyan));
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
}

.hidden{
display:none;
}
</style>
</head>
<body>

<header>
<div class="logo">NORTH PROTECTION</div>
<div class="live">● LIVE MONITORING</div>
</header>

<div class="container">

<div class="card">
<h2>Security Overview</h2>

<div class="stats">
<div class="stat">
<div>Security Score</div>
<div class="big" id="score">98</div>
</div>

<div class="stat">
<div>Threat Level</div>
<div class="big" style="color:#22c55e;">LOW</div>
</div>

<div class="stat">
<div>Accounts Protected</div>
<div class="big" id="accCount">0</div>
</div>
</div>
</div>

<div class="card">
<h2>Threat Activity</h2>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h2>Add Monitoring Account</h2>

<select id="network">
<option>Instagram</option>
<option>Facebook</option>
<option>Discord</option>
<option>Telegram</option>
<option>TikTok</option>
<option>LinkedIn</option>
</select>

<input type="text" id="login" placeholder="Account Login">
<input type="password" id="password" placeholder="Account Password">

<button onclick="addAccount()">Add Monitoring Account</button>

<div id="accounts"></div>
</div>

<div class="card">
<h2>Live Alerts</h2>

<div id="alerts"></div>
</div>

<div class="card">
<h2>Edit Profile</h2>

<div class="profile">
<div class="avatar" id="avatar">N</div>

<div>
<h3 id="profileName">North User</h3>
<p style="color:#94a3b8;">Elite Protection</p>
</div>
</div>

<br>

<input type="text" id="editName" placeholder="Edit Profile Name">

<button onclick="saveProfile()">Save Profile</button>
</div>

</div>

<div class="bottom-nav">
<div class="nav-item active">Dashboard</div>
<div class="nav-item">Social</div>
<div class="nav-item">Networks</div>
<div class="nav-item">Profile</div>
<div class="nav-item">Settings</div>
</div>

<script>
const alerts = [
"Suspicious login attempt blocked",
"VPN tunnel encrypted successfully",
"Threat analysis completed",
"Credential integrity verified",
"Unknown IP detected and isolated",
"Real-time scan completed"
];

function createAlert(){
const div = document.createElement("div");
div.className = "alert";
div.innerText = alerts[Math.floor(Math.random()*alerts.length)];

const container = document.getElementById("alerts");
container.prepend(div);

if(container.children.length > 5){
container.removeChild(container.lastChild);
}
}

setInterval(createAlert,4000);

function addAccount(){
const network = document.getElementById("network").value;
const login = document.getElementById("login").value;
const password = document.getElementById("password").value;

if(!login || !password){
alert("Fill all fields");
return;
}

const account = {
network,
login,
password
};

let accounts = JSON.parse(localStorage.getItem("northAccounts") || "[]");
accounts.push(account);

localStorage.setItem("northAccounts", JSON.stringify(accounts));

renderAccounts();

document.getElementById("login").value="";
document.getElementById("password").value="";
}

function renderAccounts(){
const container = document.getElementById("accounts");
container.innerHTML = "";

let accounts = JSON.parse(localStorage.getItem("northAccounts") || "[]");

document.getElementById("accCount").innerText = accounts.length;

accounts.forEach((acc,index)=>{
container.innerHTML += `
<div class="account">
<h3>${acc.network}</h3>
<small>Login: ${acc.login}</small>
<small>Password: ••••••••••</small>
<br>
<button onclick="removeAccount(${index})">Remove</button>
</div>
`;
});
}

function removeAccount(index){
let accounts = JSON.parse(localStorage.getItem("northAccounts") || "[]");
accounts.splice(index,1);
localStorage.setItem("northAccounts", JSON.stringify(accounts));
renderAccounts();
}

function saveProfile(){
const name = document.getElementById("editName").value;

if(!name) return;

localStorage.setItem("northProfile", name);

document.getElementById("profileName").innerText = name;
document.getElementById("avatar").innerText = name.charAt(0).toUpperCase();
}

function loadProfile(){
const name = localStorage.getItem("northProfile");

if(name){
document.getElementById("profileName").innerText = name;
document.getElementById("avatar").innerText = name.charAt(0).toUpperCase();
}
}

setInterval(()=>{
document.getElementById("score").innerText =
95 + Math.floor(Math.random()*5);
},3000);

function drawChart(){
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

canvas.width = canvas.offsetWidth;
canvas.height = 220;

let points = [];

for(let i=0;i<25;i++){
points.push(Math.random()*150+20);
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.beginPath();
ctx.moveTo(0,canvas.height);

points.forEach((p,i)=>{
const x = (i/(points.length-1))*canvas.width;
const y = canvas.height-p;

ctx.lineTo(x,y);

points[i]+=Math.random()*8-4;

if(points[i]<20) points[i]=20;
if(points[i]>180) points[i]=180;
});

ctx.strokeStyle="#22d3ee";
ctx.lineWidth=3;
ctx.shadowBlur=20;
ctx.shadowColor="#22d3ee";
ctx.stroke();

requestAnimationFrame(animate);
}

animate();
}

drawChart();
renderAccounts();
loadProfile();
createAlert();
</script>

</body>
</html>
