<style>

/* =====================================================
   FILTERS
===================================================== */

.filter-btn{

}

/* =====================================================
   MODAL
===================================================== */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
backdrop-filter:blur(12px);
display:none;
align-items:center;
justify-content:center;

padding:20px;
}

.modal-content{

max-width:520px;

overflow:hidden;
box-shadow:
0 0 50px rgba(34,211,238,.18);
animation:modalIn .4s ease;
}

@keyframes modalIn{
from{
transform:translateY(40px) scale(.9);
opacity:0;
}
to{
transform:translateY(0) scale(1);
opacity:1;
}
}

.modal-header{
display:flex;
justify-content:space-between;
align-items:center;
padding:24px;
border-bottom:1px solid rgba(255,255,255,.05);

}

/* =====================================================

overflow:hidden;

0 0 25px rgba(34,211,238,.08);
}

.account-card::before{
content:'';
position:absolute;
inset:0;
background:
linear-gradient(135deg,
rgba(255,255,255,.08),
transparent 35%);
pointer-events:none;
}

.account-glow{
position:absolute;
width:160px;
height:160px;
background:rgba(34,211,238,.12);
filter:blur(70px);

}

.account-header{

.details-content{

<script>

/* =====================================================
   MULTI ACCOUNT STORAGE
===================================================== */

let monitoredAccounts =
JSON.parse(
localStorage.getItem('north_accounts')
) || [];

/* =====================================================
   OPEN/CLOSE MODAL
===================================================== */

function openAccountModal(){

document.getElementById('accountModal')
.style.display='flex';

}

function closeAccountModal(){

document.getElementById('accountModal')
.style.display='none';

}

/* =====================================================
   CONNECT ACCOUNT
===================================================== */

function connectAccount(){

const platform =
document.getElementById('accountPlatform').value;

const username =
document.getElementById('accountUsername').value;

const email =
document.getElementById('accountEmail').value;

const level =
document.getElementById('monitorLevel').value;

const priority =
document.getElementById('securityPriority').value;

const alias =
document.getElementById('deviceAlias').value;

const notes =
document.getElementById('accountNotes').value;

/* =====================================================
   CYBER CONNECTION ANIMATION
===================================================== */

showNotification(
'Securing encrypted session...'
);

setTimeout(()=>{

showNotification(
'Analyzing account integrity...'
);

},1200);

setTimeout(()=>{

showNotification(
'Establishing monitoring tunnel...'
);

},2400);

setTimeout(()=>{

showNotification(
'Threat analysis completed.'
);

const account = {

id:Date.now(),

platform,
username,
email,
level,
priority,
alias,
notes,

score:
Math.floor(Math.random()*10)+90,

sessions:
Math.floor(Math.random()*5)+1,

risk:[
'LOW',
'MEDIUM',
'HIGH'
][Math.floor(Math.random()*3)],

location:[
'New York',
'London',
'São Paulo',
'Singapore',
'Berlin'
][Math.floor(Math.random()*5)],

lastAccess:
new Date().toLocaleString(),

status:'ACTIVE'

};

monitoredAccounts.push(account);

localStorage.setItem(
'north_accounts',
JSON.stringify(monitoredAccounts)
);

renderAccounts();

closeAccountModal();

showNotification(
'Monitoring Activated Successfully'
);

},3600);

}

/* =====================================================
   RENDER ACCOUNTS
===================================================== */

function renderAccounts(){

const container =
document.getElementById('accountsContainer');

container.innerHTML='';

monitoredAccounts.forEach(account=>{

container.innerHTML += `

<div class="account-card">

<div class="account-glow"></div>

<div class="account-header">

<div>

<div class="platform">
${account.platform}
</div>

<div style="margin-top:6px;color:#94A3B8;">
@${account.username}
</div>

</div>

<div class="live-indicator">

<div class="live-dot"></div>

MONITORING

</div>

</div>

<div class="account-grid">

<div class="account-stat">
<span>Security Score</span>
<strong>${account.score}%</strong>
</div>

<div class="account-stat">
<span>Active Sessions</span>
<strong>${account.sessions}</strong>
</div>

<div class="account-stat">
<span>Risk Level</span>
<strong>${account.risk}</strong>
</div>

<div class="account-stat">
<span>Geo Activity</span>
<strong>${account.location}</strong>
</div>

<div class="account-stat">
<span>Monitoring</span>
<strong>${account.status}</strong>
</div>

<div class="account-stat">
<span>Last Access</span>
<strong style="font-size:.8rem;">
${account.lastAccess}
</strong>
</div>

</div>

<div class="account-actions">

<button class="primary"
onclick="openDetails(${account.id})">

View Dashboard

</button>

<button class="secondary-btn"
onclick="scanAccount(${account.id})">

Run Scan

</button>

<button class="secondary-btn"
onclick="removeAccount(${account.id})">

Remove

</button>

</div>

</div>

`;

});

}

/* =====================================================
   ACCOUNT DETAILS
===================================================== */

function openDetails(id){

const account =
monitoredAccounts.find(a=>a.id===id);

document.getElementById('detailsPanel')
.style.display='block';

document.getElementById('detailsTitle')
.innerHTML = `
${account.platform} Monitoring
`;

document.getElementById('detailsBody')
.innerHTML = `

<div class="details-section">

<h3>Account Information</h3>

<div class="account-grid">

<div class="account-stat">
<span>Username</span>
<strong>${account.username}</strong>
</div>

<div class="account-stat">
<span>Email</span>
<strong>${account.email}</strong>
</div>

<div class="account-stat">
<span>Security Level</span>
<strong>${account.level}</strong>
</div>

<div class="account-stat">
<span>Priority</span>
<strong>${account.priority}</strong>
</div>

</div>

</div>

<div class="details-section">

<h3>Live Monitoring</h3>

<div class="timeline">

<div class="timeline-item">
Suspicious login attempt detected from Berlin.
</div>

<div class="timeline-item">
Unknown browser session analyzed.
</div>

<div class="timeline-item">
Geo-location mismatch identified.
</div>

<div class="timeline-item">
Credential exposure scan completed.
</div>

<div class="timeline-item">
AI anomaly detection triggered.
</div>

</div>

</div>

<div class="details-section">

<h3>Threat Analysis</h3>

<div class="account-grid">

<div class="account-stat">
<span>Phishing Risk</span>
<strong>LOW</strong>
</div>

<div class="account-stat">
<span>Password Breach</span>
<strong>NO EXPOSURE</strong>
</div>

<div class="account-stat">
<span>Unauthorized Attempts</span>
<strong>2 DETECTED</strong>
</div>

<div class="account-stat">
<span>Threat Score</span>
<strong>17%</strong>
</div>

</div>

</div>

<div class="details-section">

<h3>Account Actions</h3>

<div class="account-actions">

<button class="primary">
Pause Monitoring
</button>

<button class="secondary-btn">
Resume Monitoring
</button>

<button class="secondary-btn">
Change Password
</button>

<button class="secondary-btn">
Security Scan
</button>

</div>

</div>

`;

}

/* =====================================================
   CLOSE DETAILS
===================================================== */

function closeDetails(){

document.getElementById('detailsPanel')
.style.display='none';

}

/* =====================================================
   REMOVE ACCOUNT
===================================================== */

function removeAccount(id){

monitoredAccounts =
monitoredAccounts.filter(
a=>a.id!==id
);

localStorage.setItem(
'north_accounts',
JSON.stringify(monitoredAccounts)
);

renderAccounts();

showNotification(
'Account Removed Successfully'
);

}

/* =====================================================
   SCAN ACCOUNT
===================================================== */

function scanAccount(id){

showNotification(
'Running deep security scan...'
);

setTimeout(()=>{

showNotification(
'Analyzing encrypted sessions...'
);

},1200);

setTimeout(()=>{

showNotification(
'Threat analysis completed successfully.'
);

},2500);

}

/* =====================================================
   SEARCH
===================================================== */

function searchAccounts(){

const value =
document.getElementById('searchInput')
.value.toLowerCase();

const cards =
document.querySelectorAll('.account-card');

cards.forEach(card=>{

if(
card.innerText.toLowerCase()
.includes(value)
){

card.style.display='block';

}else{

card.style.display='none';

}

});

}

/* =====================================================
   FILTERS
===================================================== */

function filterAccounts(type){

document
.querySelectorAll('.filter-btn')
.forEach(btn=>{
btn.classList.remove('active-filter');
});

event.target.classList.add('active-filter');

const cards =
document.querySelectorAll('.account-card');

cards.forEach(card=>{

if(
type==='all'
){

card.style.display='block';

}else{

if(
card.innerText.includes(type)
){

card.style.display='block';

}else{

card.style.display='none';

}

}

});

}

/* =====================================================
   INITIAL LOAD
===================================================== */

renderAccounts();

/* =====================================================
   LIVE CYBER EXPERIENCE
===================================================== */

setInterval(()=>{

const cards =
document.querySelectorAll('.live-dot');

cards.forEach(dot=>{

dot.style.boxShadow =
`0 0 ${
Math.random()*20+10
}px #22C55E`;

});

},1000);

</script>
