<!-- =========================================================
     MONITORING MODAL
========================================================= -->

<div class="modal" id="accountModal">

<div class="modal-box">

<div class="modal-title">
Add Monitored Account
</div>

<select id="platformInput">
<option>Instagram</option>
<option>Facebook</option>
<option>TikTok</option>
<option>Discord</option>
<option>Telegram</option>
<option>X/Twitter</option>
<option>LinkedIn</option>
<option>Snapchat</option>
<option>WhatsApp</option>
<option>Gmail</option>
<option>Outlook</option>
<option>Yahoo</option>
</select>

<input type="text"
id="usernameInput"
placeholder="Username / Login">

<input type="password"
id="passwordInput"
placeholder="Password">

<select id="monitorLevelInput">
<option>Basic Monitoring</option>
<option>Advanced Monitoring</option>
<option>Deep Monitoring</option>
</select>

<div class="modal-buttons">

<button class="primary"
onclick="saveMonitoredAccount()">
Connect Account
</button>

<button class="secondary"
onclick="closeAccountModal()">
Cancel
</button>

</div>

</div>

</div>

<style>

/* =========================================================
   MONITORING SETTINGS
========================================================= */

.monitor-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
gap:12px;
flex-wrap:wrap;
}

.add-account-btn{
width:auto;
padding:14px 18px;
border-radius:16px;
background:
linear-gradient(135deg,
rgba(37,99,235,.95),
rgba(34,211,238,.95));
color:white;
font-weight:700;
font-size:.92rem;
box-shadow:
0 10px 30px rgba(34,211,238,.25);
}

.add-account-btn:hover{
transform:translateY(-2px);
}

.monitoring-title{
font-size:1rem;
font-weight:700;
color:white;
}

/* =========================================================
   ACCOUNT CARDS
========================================================= */

.account-card{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.06);
border-radius:22px;
padding:18px;
margin-bottom:14px;
position:relative;
overflow:hidden;
}

.account-card::before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
135deg,
rgba(255,255,255,.06),
transparent 35%
);
pointer-events:none;
}

.account-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
gap:12px;
}

.platform-tag{
padding:6px 12px;
border-radius:999px;
background:rgba(34,211,238,.12);
border:1px solid rgba(34,211,238,.25);
font-size:.75rem;
color:#22D3EE;
font-weight:700;
white-space:nowrap;
}

.account-user{
font-size:1rem;
font-weight:700;
margin-bottom:6px;
}

.account-info{
font-size:.82rem;
color:#94A3B8;
margin-bottom:4px;
}

.account-status{
display:flex;
align-items:center;
gap:8px;
margin-top:12px;
font-size:.82rem;
color:#22C55E;
}

.account-actions{
display:flex;
gap:10px;
margin-top:16px;
}

.small-btn{
flex:1;
padding:12px;
border-radius:14px;
font-size:.82rem;
font-weight:700;
border:none;
cursor:pointer;
}

.btn-edit{
background:rgba(37,99,235,.15);
color:#7DB2FF;
border:1px solid rgba(37,99,235,.25);
}

.btn-remove{
background:rgba(239,68,68,.12);
color:#FF8A8A;
border:1px solid rgba(239,68,68,.2);
}

/* =========================================================
   MODAL
========================================================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
backdrop-filter:blur(10px);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:9999;
}

.modal.active{
display:flex;
animation:fade .3s ease;
}

.modal-box{
width:100%;
max-width:460px;
background:
linear-gradient(
135deg,
rgba(11,17,32,.95),
rgba(5,5,5,.98)
);
border:1px solid rgba(255,255,255,.08);
border-radius:28px;
padding:24px;
box-shadow:
0 20px 60px rgba(0,0,0,.7);
position:relative;
overflow:hidden;
}

.modal-box::before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
135deg,
rgba(255,255,255,.06),
transparent 35%
);
pointer-events:none;
}

.modal-title{
font-size:1.3rem;
font-weight:700;
margin-bottom:18px;
}

.modal-buttons{
display:flex;
gap:12px;
margin-top:10px;
}

.modal-buttons button{
flex:1;
}

.secondary{
background:rgba(255,255,255,.06);
color:white;
border:1px solid rgba(255,255,255,.08);
}

</style>

<script>

/* =========================================================
   CREATE SETTINGS MONITORING SECTION
========================================================= */

window.addEventListener('load', ()=>{

const settingsCard =
document.querySelector('#settingsScreen .card');

if(settingsCard){

settingsCard.innerHTML += `

<div style="margin-top:26px;">

<div class="monitor-header">

<div class="monitoring-title">
Monitored Social Accounts
</div>

<button class="add-account-btn"
onclick="openAccountModal()">
+ Add Account
</button>

</div>

<div id="accountsList"></div>

</div>

`;

}

renderAccounts();

});

/* =========================================================
   MONITORED ACCOUNTS SYSTEM
========================================================= */

let monitoredAccounts =
JSON.parse(
localStorage.getItem('northAccounts')
) || [];

/* =========================================================
   OPEN MODAL
========================================================= */

function openAccountModal(){

document
.getElementById('accountModal')
.classList.add('active');

}

/* =========================================================
   CLOSE MODAL
========================================================= */

function closeAccountModal(){

document
.getElementById('accountModal')
.classList.remove('active');

}

/* =========================================================
   SAVE ACCOUNT
========================================================= */

function saveMonitoredAccount(){

const platform =
document.getElementById('platformInput').value;

const username =
document.getElementById('usernameInput').value;

const password =
document.getElementById('passwordInput').value;

const level =
document.getElementById('monitorLevelInput').value;

if(
username.trim()==='' ||
password.trim()===''
){

showNotification(
'Insert login credentials'
);

return;

}

const account = {

id:Date.now(),

platform,
username,
password,
level,

status:'Monitoring Active',

lastScan:
new Date().toLocaleTimeString()

};

monitoredAccounts.push(account);

localStorage.setItem(
'northAccounts',
JSON.stringify(monitoredAccounts)
);

renderAccounts();

closeAccountModal();

showNotification(
platform + ' monitoring enabled'
);

document.getElementById(
'usernameInput'
).value='';

document.getElementById(
'passwordInput'
).value='';

}

/* =========================================================
   RENDER ACCOUNTS
========================================================= */

function renderAccounts(){

const container =
document.getElementById('accountsList');

if(!container) return;

container.innerHTML='';

if(monitoredAccounts.length===0){

container.innerHTML = `

<div class="account-card">

<div class="account-info">
No monitored accounts connected.
</div>

</div>

`;

return;

}

monitoredAccounts.forEach(account=>{

container.innerHTML += `

<div class="account-card">

<div class="account-top">

<div>

<div class="account-user">
${account.username}
</div>

<div class="account-info">
${account.platform}
</div>

</div>

<div class="platform-tag">
${account.level}
</div>

</div>

<div class="account-info">
Password:
••••••••••
</div>

<div class="account-info">
Last Scan:
${account.lastScan}
</div>

<div class="account-status">

<div class="dot"></div>

${account.status}

</div>

<div class="account-actions">

<button
class="small-btn btn-edit"
onclick="editAccount(${account.id})">
Edit
</button>

<button
class="small-btn btn-remove"
onclick="removeAccount(${account.id})">
Remove
</button>

</div>

</div>

`;

});

}

/* =========================================================
   REMOVE ACCOUNT
========================================================= */

function removeAccount(id){

monitoredAccounts =
monitoredAccounts.filter(
account => account.id !== id
);

localStorage.setItem(
'northAccounts',
JSON.stringify(monitoredAccounts)
);

renderAccounts();

showNotification(
'Monitoring removed'
);

}

/* =========================================================
   EDIT ACCOUNT
========================================================= */

function editAccount(id){

const account =
monitoredAccounts.find(
a => a.id === id
);

if(!account) return;

document.getElementById(
'platformInput'
).value = account.platform;

document.getElementById(
'usernameInput'
).value = account.username;

document.getElementById(
'passwordInput'
).value = account.password;

document.getElementById(
'monitorLevelInput'
).value = account.level;

removeAccount(id);

openAccountModal();

}

</script>
